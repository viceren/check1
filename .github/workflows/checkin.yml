name: Auto Checkin

on:
  schedule:
    # 北京时间三档冗余：06:31 / 13:31 / 20:31，互为兜底。
    # 单档 scheduled workflow 在高负载时可能被延迟甚至整次丢弃，多档能显著降低断签风险。
    # 脚本在「今日已签到」时会早退且退出码 0，因此多次触发不会重复签到、无副作用。
    - cron: '31 6 * * *'
      timezone: 'Asia/Shanghai'
    - cron: '31 13 * * *'
      timezone: 'Asia/Shanghai'
    - cron: '31 20 * * *'
      timezone: 'Asia/Shanghai'
  workflow_dispatch:  # 允许手动一键触发

jobs:
  checkin:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Verify Playwright installation
        run: npx playwright --version

      - name: Run checkin script
        env:
          CHECKIN_KEY: ${{ secrets.CHECKIN_KEY }}
        run: npm run checkin

      - name: Upload checkin log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkin-log-${{ github.run_number }}
          path: checkin.log
          retention-days: 7

      - name: Upload screenshots (on failure only)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: checkin-screenshots-${{ github.run_number }}
          path: |
            artifacts/*.png
            artifacts/**/*.png
            artifacts/*.html
          if-no-files-found: ignore
          retention-days: 7

      - name: Show result
        if: always()
        run: |
          echo "=== Checkin Results ==="
          if [ -f checkin.log ]; then
            tail -20 checkin.log
          fi
          echo "======================="
